name: CI & Release Packaging

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cove-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build & audit (<170 KB gzip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build & package Chrome + Firefox MV3 bundles
        run: npm run build

      - name: MV3 CSP, zero-mock & integration tests
        run: npm run test:core

      - name: Bundle budget
        run: npm run budget

      - name: Release artifact, checksum & manifest verification
        run: npm run verify

      - name: Prune superseded release archives
        run: |
          version=$(node -p "require('./package.json').version")
          find releases -maxdepth 1 -type f -name 'cove-*-v*.zip' ! -name "*-v${version}.zip" -delete

      - name: Upload MV3 extension artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cove-mv3-bundles
          if-no-files-found: error
          retention-days: 14
          path: |
            releases/cove-chrome-mv3.zip
            releases/cove-chrome-mv3-v*.zip
            releases/cove-firefox-mv3.zip
            releases/cove-firefox-mv3-v*.zip
            releases/cove-github-source.zip
            releases/cove-github-source-v*.zip
            releases/SHA256SUMS.txt
            releases/release-manifest.json

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: cove-mv3-bundles
          path: releases

      - name: Publish immutable release notes & assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            releases/cove-chrome-mv3.zip
            releases/cove-chrome-mv3-v*.zip
            releases/cove-firefox-mv3.zip
            releases/cove-firefox-mv3-v*.zip
            releases/cove-github-source.zip
            releases/cove-github-source-v*.zip
            releases/SHA256SUMS.txt
            releases/release-manifest.json
